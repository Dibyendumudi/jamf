/* ================= EXAM METADATA ================= */
const EXAM_META = {
  100:{shortLabel:"JAMF 100", fullLabel:"Jamf 100 · Associate"},
  200:{shortLabel:"JAMF 200", fullLabel:"Jamf 200 · Tech"},
  999:{shortLabel:"PRO TIER", fullLabel:"Jamf Pro Tier · 2026 DDM"},
  300:{shortLabel:"SUP-2026", fullLabel:"Apple Device Support (SUP-2026)"},
  400:{shortLabel:"DEP-2026", fullLabel:"Apple Deployment & Management (DEP-2026)"},
  500:{shortLabel:"SVC FUND.", fullLabel:"Apple Service Fundamentals (SVC-19A)"}
};
function examLabel(examNum){ return (EXAM_META[examNum] && EXAM_META[examNum].shortLabel) || String(examNum); }
function examFullLabel(examNum){ return (EXAM_META[examNum] && EXAM_META[examNum].fullLabel) || String(examNum); }
function examTagClass(examNum){ return "t"+examNum; }
function labExamNum(lab){
  if(lab.id.startsWith("lab-sup")) return 300;
  if(lab.id.startsWith("lab-dep")) return 400;
  if(lab.id.startsWith("lab-svc")) return 500;
  if(lab.id.startsWith("lab9") || lab.id==="lab100") return 999;
  return 200;
}

/* ================= STATE ================= */
let state={
  mode:'study', track:'all', topics:new Set(),
  deck:[], idx:0, flipped:false, shuffleOn:true,
  mastery:{}, 
  mockHistory: [],
  mock:null, 
  labProgress:{}, 
  activeLab:null,
  openSelfCheck:null
};

/* ================= STORAGE ================= */
async function loadProgress(){
  try{
    const saved = localStorage.getItem('jamf-progress');
    if(saved){
      const parsed = JSON.parse(saved);
      state.mastery = parsed.mastery || {};
      state.mockHistory = parsed.mockHistory || [];
      state.labProgress = parsed.labProgress || {};
    }
  }catch(e){ console.warn('Could not load local progress:', e); }
}
async function saveProgress(){
  try{
    localStorage.setItem('jamf-progress', JSON.stringify({
      mastery:state.mastery, 
      mockHistory:state.mockHistory, 
      labProgress:state.labProgress
    }));
  }catch(e){ console.warn('Could not save local progress:', e); }
}

/* ================= HELPERS ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function filteredData(){
  return DATA.filter(d=>{
    if(state.track!=='all' && d.exam!==Number(state.track)) return false;
    if(state.topics.size>0 && !state.topics.has(d.topic)) return false;
    return true;
  });
}
function topicsForTrack(){
  const src = state.track==='all' ? DATA : DATA.filter(d=>d.exam===Number(state.track));
  return [...new Set(src.map(d=>d.topic))];
}
function letters(i){return String.fromCharCode(65+i);}

/* ================= SIDEBAR RENDER ================= */
function renderSidebar(){
  document.querySelectorAll('.track-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.track===state.track);
  });
  const chipList=document.getElementById('chipList');
  const topics=topicsForTrack();
  chipList.innerHTML = topics.map(t=>
    `<div class="chip ${state.topics.has(t)?'active':''}" data-topic="${t}">${t}</div>`
  ).join('') || '<span style="color:var(--text-faint);font-size:12px;">No topics</span>';
  chipList.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>{
      const t=c.dataset.topic;
      if(state.topics.has(t)) state.topics.delete(t); else state.topics.add(t);
      onFilterChange();
    });
  });
  renderBadgeRing();
}
function renderBadgeRing(){
  const pool=filteredData();
  const known=pool.filter(d=>state.mastery[d.id]==='known').length;
  const pct = pool.length ? Math.round((known/pool.length)*100) : 0;
  const circumference = 2*Math.PI*44;
  const offset = circumference - (pct/100)*circumference;
  document.getElementById('ringFill').style.strokeDasharray=circumference;
  document.getElementById('ringFill').style.strokeDashoffset=offset;
  document.getElementById('ringPct').textContent=pct+'%';
  document.getElementById('ringSub').textContent=`${known} of ${pool.length} cards mastered`;
}

function onFilterChange(){
  renderSidebar();
  if(state.mode==='study') buildDeck();
  render();
}

/* ================= STUDY MODE ================= */
function buildDeck(){
  let pool = filteredData();
  if(state.shuffleOn) pool = shuffle(pool);
  state.deck = pool;
  state.idx = 0;
  state.flipped = false;
}
function markCard(status){
  const card = state.deck[state.idx];
  if(!card) return;
  state.mastery[card.id]=status;
  saveProgress();
  renderBadgeRing();
  goNext();
}
function goNext(){
  state.flipped=false;
  if(state.idx < state.deck.length-1){ state.idx++; } 
  render();
}
function goPrev(){
  state.flipped=false;
  if(state.idx>0){ state.idx--; }
  render();
}

              <span class="exam-tag t${card.exam}">${labelText}</span>
              <span class="topic-tag">${card.topic}</span>

            <span class="status-led ${status}"></span>
          </div>

          <div class="face-content">${card.options[0]}

  attachPlanToggle();

/* ================= MOCK TEST MODE ================= */
function renderMockSetup(){
  const stage=document.getElementById('stage');
  const pool=filteredData();
  const maxCount=pool.length;
  const options=[10,20,30].filter(n=>n<=maxCount);
  if(maxCount>0 && !options.includes(maxCount)) options.push(maxCount);
  stage.innerHTML=`
    <div class="mock-setup">
      <h3>Mock Test</h3>
      <p>Pulls from your current track/topic filter (${maxCount} question${maxCount===1?'':'s'} available). Timed at ~72 seconds per question, a solid general pace across the Jamf and Apple multiple-choice exams. A score of 80% or higher is a pass.</p>
      <div class="setup-row" id="countRow">
        ${options.map(n=>`<button class="count-btn" data-count="${n}">${n} questions</button>`).join('')}
      </div>
      <button class="start-btn" id="startMockBtn" ${maxCount===0?'disabled':''}>Start Mock Test</button>
    </div>`;
  let chosen = options[0]||0;
  const countBtns=stage.querySelectorAll('.count-btn');
  countBtns.forEach((b,i)=>{
    if(i===0) b.classList.add('active');
    b.addEventListener('click',()=>{
      countBtns.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      chosen=Number(b.dataset.count);
    });
  });
  document.getElementById('startMockBtn').addEventListener('click',()=>startMock(chosen));
}

function startMock(count){
  const pool=shuffle(filteredData()).slice(0,count);
  const queue=pool.map(d=>{
    const opts = shuffle(d.options.map((o,i)=>({text:o,correct:i===0})));
    return {...d, shuffledOptions:opts};
  });
  state.mock={
    queue, index:0, answers:{}, total:count,
    timeLeft: count*72, timerId:null
  };
  if(state.mock.timerId) clearInterval(state.mock.timerId);
  state.mock.timerId=setInterval(()=>{
    state.mock.timeLeft--;
    if(state.mock.timeLeft<=0){ clearInterval(state.mock.timerId); submitMock(); return; }
    updateTimerDisplay();
  },1000);
  render();
}
function updateTimerDisplay(){
  const el=document.getElementById('mockTimer');
  if(!el || !state.mock) return;
  const t=state.mock.timeLeft;
  const m=Math.floor(t/60), s=t%60;
  el.textContent=`⏱ ${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', t<60);
}
function selectMockOption(qIndex, optText){
  state.mock.answers[qIndex]=optText;
  render();
}
function mockNav(delta){
  state.mock.index=Math.max(0,Math.min(state.mock.queue.length-1,state.mock.index+delta));
  render();
}
function submitMock(){
  if(state.mock.timerId) clearInterval(state.mock.timerId);
  let correctCount=0;
  const byTopic={};
  state.mock.queue.forEach((q,i)=>{
    const ans=state.mock.answers[i];
    const correctOpt = q.shuffledOptions.find(o=>o.correct);
    const isCorrect = ans===correctOpt.text;
    if(isCorrect) correctCount++;
    byTopic[q.topic]=byTopic[q.topic]||{correct:0,total:0};
    byTopic[q.topic].total++;
    if(isCorrect) byTopic[q.topic].correct++;
  });
  const scorePct = Math.round((correctCount/state.mock.total)*100);
  state.mock.finished=true;
  state.mock.score=correctCount;
  state.mock.scorePct=scorePct;
  state.mock.byTopic=byTopic;
  state.mockHistory.unshift({
    date:new Date().toISOString(), track:state.track, total:state.mock.total,
    score:correctCount, scorePct
  });
  state.mockHistory=state.mockHistory.slice(0,20);
  saveProgress();
  try{ localStorage.setItem('exam-closed', new Date().toISOString()); }catch(e){}
  render();
}
function renderMockQuestion(){
  const stage=document.getElementById('stage');
  const m=state.mock;
  const q=m.queue[m.index];
  const answered=m.answers[m.index];
  let labelText = examLabel(q.exam);

  stage.innerHTML=`
    <div class="mock-top">
      <div class="stage-counter">QUESTION ${m.index+1} / ${m.total}</div>
      <div class="timer" id="mockTimer">⏱ --:--</div>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${((m.index+1)/m.total)*100}%"></div></div>
    <div class="q-card">
      <div class="tag-group" style="margin-bottom:10px;">
        <span class="exam-tag t${q.exam}">${labelText}</span>
        <span class="topic-tag">${q.topic}</span>
      </div>
      <div class="q-text">${q.q}</div>
      ${q.shuffledOptions.map((o,i)=>`
        <div class="opt ${answered===o.text?'selected':''}" data-opt="${i}">
          <span class="opt-letter">${letters(i)}</span><span>${o.text}</span>
        </div>`).join('')}
    </div>
    <div class="mock-nav">
      <button class="nav-arrow" id="mPrev" ${m.index===0?'disabled':''}>← Previous</button>
      ${m.index===m.total-1
        ? `<button class="submit-btn" id="mSubmit">Submit Test</button>`
        : `<button class="nav-arrow" id="mNext">Next →</button>`}
    </div>
  `;
  updateTimerDisplay();
  stage.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>selectMockOption(m.index, q.shuffledOptions[Number(el.dataset.opt)].text));
  });
  const prevBtn=document.getElementById('mPrev'); if(prevBtn) prevBtn.addEventListener('click',()=>mockNav(-1));
  const nextBtn=document.getElementById('mNext'); if(nextBtn) nextBtn.addEventListener('click',()=>mockNav(1));
  const subBtn=document.getElementById('mSubmit'); if(subBtn) subBtn.addEventListener('click',submitMock);
}
function renderMockResults(){
  const stage=document.getElementById('stage');
  const m=state.mock;
  const pass=m.scorePct>=80;
  const topics=Object.keys(m.byTopic);
  stage.innerHTML=`
    <div class="results-head">
      <div class="score-big ${pass?'pass':'fail'}">${m.scorePct}%</div>
      <div class="results-sub">${m.score} of ${m.total} correct — ${pass?'PASS (80%+ threshold)':'Below the 80% pass threshold'}</div>
    </div>
    <div class="section-title">Score by topic</div>
    <div class="topic-breakdown">
      ${topics.map(t=>{
        const d=m.byTopic[t]; const pct=Math.round((d.correct/d.total)*100);
        return `<div class="tb-row">
          <div class="tb-label">${t}</div>
          <div class="tb-bar"><div class="tb-fill" style="width:${pct}%"></div></div>
          <div class="tb-frac">${d.correct}/${d.total}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="section-title">Review</div>
    <div id="reviewList">
      ${m.queue.map((q,i)=>{
        const ans=m.answers[i];
        const correctOpt=q.shuffledOptions.find(o=>o.correct);
        const wasCorrect=ans===correctOpt.text;
        return `<div class="review-item">
          <div class="review-q">${i+1}. ${q.q}</div>
          <div class="review-a ${wasCorrect?'right-line':'wrong-line'}">Your answer: ${ans || '(skipped)'} ${wasCorrect?'✓':'✗'}</div>
          ${!wasCorrect ? `<div class="review-a right-line">Correct: ${correctOpt.text}</div>` : ''}
          ${q.note ? `<div class="face-note" style="border:none;padding-top:6px;margin-top:6px;">${q.note}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="nav-row" style="margin-top:6px;">
      <button class="nav-arrow" id="retakeBtn">Finish and close exam</button>
    </div>
  `;
  document.getElementById('retakeBtn').addEventListener('click',()=>{ showClosed(); });
}
function renderMock(){
  if(!state.mock){ renderMockSetup(); return; }
  if(state.mock.finished){ renderMockResults(); return; }
  renderMockQuestion();
}

/* ================= LABS MODE ================= */
function labStepCount(lab){ return lab.steps.length; }
function labDoneCount(lab){
  let n=0;
  for(let i=0;i<lab.steps.length;i++){ if(state.labProgress[lab.id+'-'+i]) n++; }
  return n;
}
function toggleStep(labId, stepIdx){
  const key=labId+'-'+stepIdx;
  state.labProgress[key] = !state.labProgress[key];
  saveProgress();
  render();
}
function toggleSelfCheck(key){
  state.openSelfCheck = state.openSelfCheck===key ? null : key;
  render();
}
function openLab(labId){
  state.activeLab=labId;
  render();
}
function renderLabs(){
  if(state.activeLab){ renderLabDetail(state.activeLab); }
  else{ renderLabList(); }
}

/* ================= PROGRESS MODE ================= */
const EXAM_COLOR_VAR = {100:'--accent-100', 200:'--accent-200', 999:'--accent-pro', 300:'--accent-300', 400:'--accent-400', 500:'--accent-500'};
function examColorVar(examNum){ return EXAM_COLOR_VAR[examNum] || '--accent-200'; }
function renderProgress(){
  const stage = document.getElementById('stage');
  const trackNums = [...new Set(DATA.map(d=>d.exam))].sort((a,b)=>a-b);
  const mockCount = state.mockHistory.length;
  const avgScore = mockCount ? Math.round(state.mockHistory.reduce((s,h)=>s+h.scorePct,0)/mockCount) : 0;

  const trackStatBoxes = trackNums.map(num=>{
    const known = DATA.filter(d=>d.exam===num && state.mastery[d.id]==='known').length;
    const total = DATA.filter(d=>d.exam===num).length;
    return `<div class="stat-box"><div class="stat-num" style="color:var(${examColorVar(num)})">${known}/${total}</div><div class="stat-label">${examLabel(num)} MASTERED</div></div>`;
  }).join('');

  const topicStats = [...new Set(DATA.map(d=>d.topic))].map(t=>{
    const items = DATA.filter(d=>d.topic===t);
    const known = items.filter(d=>state.mastery[d.id]==='known').length;
    return {topic:t, known, total:items.length, exam:items[0].exam};
  }).sort((a,b)=>a.exam-b.exam || (a.known/a.total)-(b.known/b.total));

  // Build HTML strings outside of the main template literal to avoid escaping conflicts
  let historyHtml = '';
  if (state.mockHistory.length === 0) {
    historyHtml = `<div class="empty-state" style="padding:24px;">No mock tests taken yet.</div>`;
  } else {
    historyHtml = state.mockHistory.map(h => {
      const d = new Date(h.date);
      const isPass = h.scorePct >= 80;
      const radius = 16;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (h.scorePct / 100) * circumference;

      return `
        <div class="history-item">
          <div class="history-info">
            <span class="history-title">${h.track==='all' ? 'Mixed Practice Exam' : examLabel(Number(h.track)) + ' Mock Test'}</span>
            <span class="history-meta">${d.toLocaleDateString()} · ${h.total} questions</span>
          </div>
          <div class="history-score-wrap">
            <span class="h-status ${isPass ? 'h-pass' : 'h-fail'}">${isPass ? 'PASS' : 'FAIL'}</span>
            <div class="mini-ring">
              <svg viewBox="0 0 42 42">
                <circle class="bg" cx="21" cy="21" r="${radius}"></circle>
                <circle class="fg ${isPass ? 'pass' : 'fail'}" cx="21" cy="21" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" data-target-offset="${offset}" stroke-linecap="round"></circle>
              </svg>
              <div class="mini-ring-text ${isPass ? 'h-pass' : 'h-fail'}">${h.scorePct}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  let topicHtml = topicStats.map(t => {
    const pct = t.total ? Math.round((t.known/t.total)*100) : 0;
    const bg = `var(${examColorVar(t.exam)})`;
    const label = examLabel(t.exam);

    return `
      <div class="tb-row">
        <div class="tb-label"><span class="exam-tag ${examTagClass(t.exam)}" style="margin-right:6px;">${label}</span>${t.topic}</div>
        <div class="tb-bar"><div class="tb-fill" style="width:${pct}%;background:${bg}"></div></div>
        <div class="tb-frac">${t.known}/${t.total}</div>
      </div>`;
  }).join('');

  stage.innerHTML = `
    <div class="stat-grid">
      ${trackStatBoxes}
      <div class="stat-box"><div class="stat-num">${mockCount ? avgScore+'%' : '—'}</div><div class="stat-label">AVG MOCK SCORE (${mockCount})</div></div>
      <div class="stat-box"><div class="stat-num">${LABS.filter(l=>labDoneCount(l)===labStepCount(l)).length}/${LABS.length}</div><div class="stat-label">LABS COMPLETED</div></div>
    </div>

    <div class="section-title">Mastery by topic</div>
    <div class="topic-breakdown">
      ${topicHtml}
    </div>

    <div class="section-title">Mock test history</div>
    ${historyHtml}
  `;

  // Animate the SVG rings filling up
  setTimeout(() => {
    const rings = stage.querySelectorAll('.mini-ring .fg');
    rings.forEach(ring => {
      ring.style.strokeDashoffset = ring.getAttribute('data-target-offset');
    });
  }, 20);
}

/* ================= MASTER RENDER ================= */
function render(){
  const stage = document.getElementById('stage');
  stage.classList.remove('animate-in');
  
  setTimeout(() => {
    if(state.mode==='study') renderStudy();
    else if(state.mode==='labs') renderLabs();
    else if(state.mode==='mock') renderMock();
    else renderProgress();
    
    stage.classList.add('animate-in');
  }, 10);
}

/* ================= EVENTS ================= */
document.querySelectorAll('.nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode=btn.dataset.mode;
    if(state.mode==='study' && state.deck.length===0) buildDeck();
    render();
  });
});
document.querySelectorAll('.track-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    state.track=btn.dataset.track;
    state.topics.clear();
    state.mock=null;
    onFilterChange();
    if(state.mode==='study') buildDeck();
    render();
  });
});
document.getElementById('resetBtn').addEventListener('click',async ()=>{
  const rb=document.getElementById('resetBtn');
  if(rb.dataset.arm!=='1'){ rb.dataset.arm='1'; rb.textContent='Click again to confirm reset'; setTimeout(()=>{rb.dataset.arm='0'; rb.textContent='Reset all progress';},4000); return; }
  rb.dataset.arm='0'; rb.textContent='Reset all progress';
  state.mastery={};
  state.mockHistory=[];
  state.labProgress={};
  state.activeLab=null;
  await saveProgress();
  renderSidebar();
  render();
});
document.addEventListener('keydown',(e)=>{
  if(state.mode!=='study') return;
  if(e.code==='Space'){ e.preventDefault(); state.flipped=!state.flipped; render(); }
  else if(e.code==='ArrowRight'){ goNext(); }
  else if(e.code==='ArrowLeft'){ goPrev(); }
});

/* ================= INIT ================= */
function examClosed(){ try{ return !!localStorage.getItem('exam-closed'); }catch(e){ return false; } }
function showClosed(){
  document.querySelector('.wrap').innerHTML='<div class="card-panel" style="max-width:520px;margin:12vh auto;text-align:center"><div class="score-big" style="font-size:28px">Exam closed</div><p class="results-sub">Your attempt was submitted on this device and this exam link is now closed. Contact your facilitator for your result or a new session.</p></div>';
}
(async function init(){
  if(examClosed()){ showClosed(); return; }
  await loadProgress();
  renderSidebar();
  buildDeck();
  render();
})();
</script>
</body></html>
