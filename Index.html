<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jamf &amp; Apple IT Cert · Pro Exam Simulator</title>
<!-- Added Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root{
  color-scheme:dark;
  --bg:#0F141B;
  --panel:#171E27;
  --panel-2:#1E2731;
  --line:#2A3542;
  --text:#E8ECF1;
  --text-dim:#8D99AC;
  --text-faint:#5C6A7E;
  --accent-100:#45D0C4;
  --accent-100-dim:rgba(69,208,196,.14);
  --accent-200:#F2A93B;
  --accent-200-dim:rgba(242,169,59,.14);
  --accent-pro:#E8618C;
  --accent-pro-dim:rgba(232,97,140,.14);
  --accent-300:#38BDF8;
  --accent-300-dim:rgba(56,189,248,.14);
  --accent-400:#8B7FF0;
  --accent-400-dim:rgba(139,127,240,.14);
  --accent-500:#FF8A5C;
  --accent-500-dim:rgba(255,138,92,.14);
  --good:#4ADE80;
  --good-dim:rgba(74,222,128,.14);
  --bad:#F0665C;
  --bad-dim:rgba(240,102,92,.14);
  --info:#6C8EEF;
  --radius:14px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(69,208,196,.07), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(242,169,59,.06), transparent 55%);
  pointer-events:none;
  z-index:0;
}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;}
.led{
  width:9px;height:9px;border-radius:50%;background:var(--accent-pro);
  box-shadow:0 0 0 0 rgba(232,97,140,.6);
  animation:pulse 2.4s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(232,97,140,.55);}
  70%{box-shadow:0 0 0 7px rgba(232,97,140,0);}
  100%{box-shadow:0 0 0 0 rgba(232,97,140,0);}
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-title{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.3px;}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);letter-spacing:.5px;}

.nav{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;}
.nav button{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.4px;
  padding:8px 14px;border-radius:7px;border:none;background:transparent;
  color:var(--text-dim);cursor:pointer;transition:.15s;
  display: flex; align-items: center; gap: 6px;
}
.nav button.active{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.nav button:hover:not(.active){color:var(--text);}

/* ---------- Layout & View Animations ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start;}
@media (max-width:820px){.layout{grid-template-columns:1fr;}}

@keyframes fadeSlideUp {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}
.animate-in {
  animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Glassmorphism Panel Upgrade */
.card-panel {
  background: rgba(23, 30, 39, 0.65); 
  backdrop-filter: blur(12px); 
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(42, 53, 66, 0.8);
  border-top: 1px solid rgba(255, 255, 255, 0.08); 
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
}

/* ---------- Sidebar ---------- */
.side-block{margin-bottom:20px;}
.side-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;}

.track-toggle{display:flex;flex-direction:column;gap:6px;}
.track-btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text-dim);cursor:pointer;font-size:13px;font-weight:600;
  transition:.15s;
}
.track-btn .dot{width:7px;height:7px;border-radius:50%;}
.track-btn[data-track="100"] .dot{background:var(--accent-100);}
.track-btn[data-track="200"] .dot{background:var(--accent-200);}
.track-btn[data-track="999"] .dot{background:var(--accent-pro);}
.track-btn[data-track="300"] .dot{background:var(--accent-300);}
.track-btn[data-track="400"] .dot{background:var(--accent-400);}
.track-btn[data-track="500"] .dot{background:var(--accent-500);}
.track-btn[data-track="all"] .dot{background:var(--info);}
.track-btn.active{color:var(--text);border-color:currentColor;}
.track-btn[data-track="100"].active{background:var(--accent-100-dim);border-color:var(--accent-100);}
.track-btn[data-track="200"].active{background:var(--accent-200-dim);border-color:var(--accent-200);}
.track-btn[data-track="999"].active{background:var(--accent-pro-dim);border-color:var(--accent-pro);}
.track-btn[data-track="300"].active{background:var(--accent-300-dim);border-color:var(--accent-300);}
.track-btn[data-track="400"].active{background:var(--accent-400-dim);border-color:var(--accent-400);}
.track-btn[data-track="500"].active{background:var(--accent-500-dim);border-color:var(--accent-500);}
.track-btn[data-track="all"].active{background:rgba(108,142,239,.14);border-color:var(--info);}

.chip-list{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  font-size:11.5px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text-dim);cursor:pointer;transition:.15s;
}
.chip.active{background:var(--panel);color:var(--text);border-color:var(--text-dim);}

.badge-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px;}
.badge-ring{position:relative;width:104px;height:104px;}
.badge-ring svg{transform:rotate(-90deg);}
.badge-ring .bg-ring{fill:none;stroke:var(--line);stroke-width:8;}
.badge-ring .fg-ring{fill:none;stroke:var(--info);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.badge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.badge-pct{font-family:var(--font-display);font-weight:700;font-size:20px;}
.badge-caption{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);letter-spacing:.5px;}
.badge-sub{font-size:11px;color:var(--text-dim);text-align:center;}

.reset-btn{
  width:100%;margin-top:6px;padding:8px;font-size:11.5px;font-family:var(--font-mono);
  background:transparent;border:1px solid var(--line);color:var(--text-faint);border-radius:8px;cursor:pointer;
}
.reset-btn:hover{color:var(--bad);border-color:var(--bad);}

/* ---------- Plan panel ---------- */
.plan-toggle{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  padding:12px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;
}
.plan-toggle-title{font-family:var(--font-display);font-weight:600;font-size:13.5px;}
.plan-toggle-arrow{color:var(--text-faint);transition:transform .2s;font-size:12px;}
.plan-body{display:none;padding:4px 4px 14px;font-size:13px;color:var(--text-dim);line-height:1.65;}
.plan-body.open{display:block;}
.plan-body ol{margin:8px 0 0;padding-left:20px;}
.plan-body li{margin-bottom:7px;}
.plan-body b{color:var(--text);}
.fact-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.fact-pill{font-family:var(--font-mono);font-size:10.5px;background:var(--panel);border:1px solid var(--line);padding:5px 9px;border-radius:7px;color:var(--text-dim);}

/* ---------- Study stage ---------- */
.stage-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.stage-counter{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.stage-controls{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
  padding:7px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-family:var(--font-mono);
}
.icon-btn.on{color:var(--accent-100);border-color:var(--accent-100);}
.icon-btn:hover{color:var(--text);}

.progressbar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px;}
.progressbar-fill{height:100%;background:linear-gradient(90deg,var(--accent-100),var(--accent-200));transition:width .3s;}

/* Flashcard Upgrades */
.flashcard-outer {
  perspective: 1600px;
  height: 300px;
  margin-bottom: 20px;
}
.flashcard {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  border-radius: 16px;
}
.flashcard:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 40px -10px rgba(69, 208, 196, 0.15);
}
.flashcard.flipped {
  transform: rotateY(180deg);
}
.flashcard.flipped:hover {
  transform: rotateY(180deg) translateY(-4px);
}
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 26px 30px;
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  background-image: 
    linear-gradient(160deg, var(--panel-2), var(--panel)),
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 100% 100%, 20px 20px, 20px 20px;
}
.face.back{transform:rotateY(180deg);}
.face-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.tag-group{display:flex;gap:7px;align-items:center;}
.exam-tag{font-family:var(--font-mono);font-size:10.5px;padding:4px 9px;border-radius:6px;font-weight:600;letter-spacing:.4px;}
.exam-tag.t100{background:var(--accent-100-dim);color:var(--accent-100);}
.exam-tag.t200{background:var(--accent-200-dim);color:var(--accent-200);}
.exam-tag.t999{background:var(--accent-pro-dim);color:var(--accent-pro);}
.exam-tag.t300{background:var(--accent-300-dim);color:var(--accent-300);}
.exam-tag.t400{background:var(--accent-400-dim);color:var(--accent-400);}
.exam-tag.t500{background:var(--accent-500-dim);color:var(--accent-500);}
.topic-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.status-led{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-led.new{background:var(--text-faint);}
.status-led.learning{background:var(--bad);}
.status-led.known{background:var(--good);}
.face-label{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.face-content{font-family:var(--font-display);font-size:19px;line-height:1.45;font-weight:600;flex:1;overflow:auto;}
.face.back .face-content{font-family:var(--font-body);font-size:15.5px;font-weight:500;color:var(--text);}
.face-hint{font-size:11px;color:var(--text-faint);text-align:center;margin-top:auto;padding-top:10px;}
.face-note{font-size:12.5px;color:var(--text-dim);margin-top:10px;line-height:1.55;padding-top:10px;border-top:1px solid var(--line);}

.mark-row{display:flex;gap:10px;margin-bottom:14px;}
.mark-btn{
  flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);
  font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;
  background:var(--panel-2);color:var(--text-dim);transition:.15s;
}
.mark-btn.learning:hover{background:var(--bad-dim);color:var(--bad);border-color:var(--bad);}
.mark-btn.known:hover{background:var(--good-dim);color:var(--good);border-color:var(--good);}

.nav-row{display:flex;justify-content:space-between;gap:10px;}
.nav-arrow{
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  padding:9px 16px;border-radius:9px;cursor:pointer;font-family:var(--font-mono);font-size:12px;
}
.nav-arrow:hover{color:var(--text);border-color:var(--text-dim);}
.nav-arrow:disabled{opacity:.35;cursor:default;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state b{color:var(--text);}

/* ---------- Mock test ---------- */
.mock-setup{text-align:center;padding:20px 10px 6px;}
.mock-setup h3{font-family:var(--font-display);font-size:19px;margin:0 0 6px;}
.mock-setup p{color:var(--text-dim);font-size:13.5px;max-width:440px;margin:0 auto 22px;line-height:1.6;}
.setup-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.count-btn{
  padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);font-size:12.5px;
}
.count-btn.active{color:var(--text);border-color:var(--accent-200);background:var(--accent-200-dim);}
.start-btn{
  padding:13px 30px;border-radius:11px;border:none;background:var(--accent-200);color:#1A1206;
  font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font-body);
}
.start-btn:hover{filter:brightness(1.08);}
.start-btn:disabled{opacity:.4;cursor:default;}

.mock-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.timer{font-family:var(--font-mono);font-size:13px;padding:6px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);}
.timer.low{color:var(--bad);border-color:var(--bad);}
.q-card{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px;}
.q-text{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.5;margin-bottom:18px;}
.opt{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);margin-bottom:9px;cursor:pointer;font-size:14px;transition:.12s;
}
.opt:hover{border-color:var(--text-dim);}
.opt.selected{border-color:var(--info);background:rgba(108,142,239,.1);}
.opt.correct{border-color:var(--good);background:var(--good-dim);}
.opt.incorrect{border-color:var(--bad);background:var(--bad-dim);}
.opt-letter{
  width:22px;height:22px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;flex-shrink:0;
}
.mock-nav{display:flex;justify-content:space-between;gap:10px;}
.submit-btn{
  padding:12px 24px;border-radius:10px;border:none;background:var(--good);color:#0A2110;
  font-weight:700;cursor:pointer;font-family:var(--font-body);font-size:13.5px;
}

.results-head{text-align:center;padding:8px 0 22px;}
.score-big{font-family:var(--font-display);font-size:44px;font-weight:700;}
.score-big.pass{color:var(--good);}
.score-big.fail{color:var(--bad);}
.results-sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;}
.topic-breakdown{display:flex;flex-direction:column;gap:10px;margin:18px 0 22px;}
.tb-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.tb-label{width:220px;flex-shrink:0;color:var(--text-dim);display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.tb-bar{flex:1;height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.tb-fill{height:100%;background:var(--accent-100);}
.tb-frac{font-family:var(--font-mono);width:44px;text-align:right;color:var(--text-faint);}
.review-item{padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel-2);}
.review-q{font-size:13.5px;font-weight:600;margin-bottom:6px;}
.review-a{font-size:12.5px;color:var(--text-dim);}
.review-a.wrong-line{color:var(--bad);}
.review-a.right-line{color:var(--good);}

/* ---------- Progress Rings & Enhanced History ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
@media (max-width:600px){.stat-grid{grid-template-columns:1fr 1fr;}}
.stat-box{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-label{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.5px;margin-top:4px;}
.section-title{font-family:var(--font-display);font-size:14px;font-weight:600;margin:22px 0 12px;color:var(--text-dim);}

.mini-ring {
  position: relative;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
}
.mini-ring svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}
.mini-ring circle {
  fill: none;
  stroke-width: 3.5;
}
.mini-ring .bg { stroke: var(--panel); }
.mini-ring .fg { transition: stroke-dashoffset 0.8s ease-in-out; }
.mini-ring .fg.pass { stroke: var(--good); }
.mini-ring .fg.fail { stroke: var(--bad); }
.mini-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(30, 39, 49, 0.4);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: background 0.2s, border-color 0.2s;
}
.history-item:hover {
  background: var(--panel-2);
  border-color: var(--text-faint);
}
.history-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.history-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14.5px;
  color: var(--text);
}
.history-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.history-score-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}
.h-status {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ---------- Labs ---------- */
.lab-intro{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.lab-intro b{color:var(--text);}
.lab-grid{display:flex;flex-direction:column;gap:10px;}
.lab-card{
  display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:.15s;
}
.lab-card:hover{border-color:var(--accent-200);}
.lab-num{
  font-family:var(--font-mono);font-size:13px;color:var(--accent-200);width:30px;flex-shrink:0;
  border:1px solid var(--line);border-radius:8px;height:30px;display:flex;align-items:center;justify-content:center;
}
.lab-info{flex:1;min-width:0;}
.lab-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin-bottom:3px;}
.lab-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.lab-mini-bar{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex-shrink:0;}
.lab-mini-fill{height:100%;background:var(--accent-200);}
.lab-pct{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:34px;text-align:right;flex-shrink:0;}

.lab-back{background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--font-mono);font-size:12px;margin-bottom:16px;}
.lab-back:hover{color:var(--text);}
.lab-detail-head{margin-bottom:18px;}
.lab-detail-title{font-family:var(--font-display);font-size:21px;font-weight:700;margin-bottom:6px;}
.lab-detail-obj{font-size:13.5px;color:var(--text-dim);line-height:1.6;}
.lab-section-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent-200);margin:22px 0 10px;}
.prereq-list{font-size:13px;color:var(--text-dim);line-height:1.7;padding-left:18px;margin:0;}
.step-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);margin-bottom:8px;cursor:pointer;
}
.step-item.done{border-color:var(--good);background:var(--good-dim);}
.step-check{
  width:19px;height:19px;border-radius:6px;border:1px solid var(--text-faint);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
}
.step-item.done .step-check{background:var(--good);border-color:var(--good);color:#0A2110;}
.step-text{font-size:13.5px;line-height:1.55;}
.step-text.done-text{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint);}
.verify-box{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25);border-radius:10px;padding:14px 16px;margin-top:6px;}
.verify-box ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text-dim);line-height:1.7;}
.verify-box .vb-title{font-family:var(--font-mono);font-size:11px;color:var(--good);letter-spacing:.5px;}
.challenge-box{background:rgba(242,169,59,.06);border:1px solid rgba(242,169,59,.25);border-radius:10px;padding:14px 16px;margin-top:12px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.challenge-box .cb-title{font-family:var(--font-mono);font-size:11px;color:var(--accent-200);letter-spacing:.5px;display:block;margin-bottom:6px;}
.selfcheck-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.sc-q{padding:12px 15px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--panel-2);display:flex;justify-content:space-between;align-items:center;}
.sc-a{padding:0 15px;font-size:13px;color:var(--text-dim);line-height:1.6;max-height:0;overflow:hidden;transition:.2s;}
.sc-a.open{padding:12px 15px;max-height:200px;}
.lab-progress-top{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px;}
.lab-progress-top-fill{height:100%;background:var(--accent-200);transition:width .3s;}

::selection{background:var(--accent-200);color:#1a1206;}
</style>

<script>
/* ================= DATA ================= */
const DATA = [
// ---------------- JAMF 100 ----------------
{id:"j100-1",exam:100,topic:"Fundamentals",q:"What Apple service does Jamf Pro rely on to push MDM commands to a device?",options:["Apple Push Notification service (APNs)","iCloud Relay","Bonjour discovery","TestFlight"],note:"Jamf Pro holds an APNs certificate that 'wakes' a device and delivers MDM commands over Apple's push network."},
{id:"j100-2",exam:100,topic:"Fundamentals",q:"Which management channel do iOS and iPadOS devices use to talk to Jamf Pro?",options:["The native MDM protocol only","The Jamf management framework (binary) only","Both MDM and the Jamf binary","SSH"],note:"Only computers can install the Jamf binary for extras like policies and scripts — mobile devices are managed purely through Apple's MDM protocol."},
{id:"j100-3",exam:100,topic:"Fundamentals",q:"What must be uploaded to Jamf Pro before it can manage any device at all?",options:["A valid APNs certificate","A VPN configuration","A static IP allow-list","A local admin password"],note:"Without a current APNs certificate, MDM commands can't be delivered and management breaks fleet-wide."},
{id:"j100-4",exam:100,topic:"Fundamentals",q:"Which Apple platforms can Jamf Pro manage besides macOS and iOS?",options:["iPadOS and tvOS","Android and Windows","watchOS only","Linux servers"],note:"Core Jamf Pro platform support covers macOS, iOS, iPadOS, and tvOS."},
{id:"j100-5",exam:100,topic:"Enrollment",q:"Which enrollment method supervises a device automatically and can apply settings before Setup Assistant finishes?",options:["Automated Device Enrollment","User-Initiated Enrollment","Manual profile installation","Enrollment via email link only"],note:"Tied to Apple Business Manager / Apple School Manager, this is Apple's zero-touch, supervised enrollment path."},
{id:"j100-6",exam:100,topic:"Enrollment",q:"Is Automated Device Enrollment the only way to supervise a mobile device?",options:["No — Apple Configurator can also supervise devices","Yes, supervision requires ADE","No — any enrollment method supervises devices","Supervision no longer exists on iOS"],note:"Apple Configurator can supervise a device connected directly to a Mac, though ADE is the standard scalable method."},
{id:"j100-7",exam:100,topic:"Enrollment",q:"What does a user do during 'User-Initiated Enrollment'?",options:["Browses to an enrollment URL and installs the MDM profile themselves","Nothing — it's fully automatic","Calls IT to remote in","Downloads the Jamf Pro server software"],note:"This self-service style enrollment is common for BYOD and produces an unsupervised device by default."},
{id:"j100-8",exam:100,topic:"Enrollment",q:"Which Jamf Pro object controls Setup Assistant screens and settings applied during Automated Device Enrollment?",options:["A PreStage Enrollment","A Smart Group","An Extension Attribute","A Restricted Software record"],note:"PreStage Enrollments define which panes appear, initial scope, and supervision/MDM settings for ADE devices."},
{id:"j100-9",exam:100,topic:"Inventory & Groups",q:"What's the key difference between a Smart Group and a Static Group?",options:["Smart Groups auto-update from saved criteria; Static Groups have a fixed, manual membership","Static Groups auto-update; Smart Groups are fixed","Both update automatically","Smart Groups can only contain mobile devices"],note:"Smart Groups are essentially saved, live searches; Static Groups are hand-picked rosters."},
{id:"j100-10",exam:100,topic:"Inventory & Groups",q:"By default, does a Simple inventory search return exact or partial matches?",options:["Exact matches","Partial (wildcard) matches","Fuzzy/approximate matches","It searches only device names"],note:"Wildcards or advanced criteria are needed to broaden a Simple Search beyond exact-match results."},
{id:"j100-11",exam:100,topic:"Inventory & Groups",q:"Which action updates a computer's inventory record in Jamf Pro?",options:["Running a recurring or manual 'Update Inventory' (recon)","Restarting the computer","Renaming the computer","Installing any app"],note:"Inventory refreshes happen on a check-in schedule, via policy, or via a remote 'Update Inventory' command."},
{id:"j100-12",exam:100,topic:"Config Profiles",q:"A configuration profile is saved without any scope assigned. What happens?",options:["It isn't deployed to any device","It deploys to all devices","It deploys only to computers, not mobile devices","Jamf Pro auto-assigns it to administrators' devices"],note:"No target means no delivery — scope must be explicitly set."},
{id:"j100-13",exam:100,topic:"Config Profiles",q:"What underlying file format do most configuration profile payloads use?",options:["Property list (.plist / XML)","JSON only","YAML","Shell script"],note:"Configuration profiles are structured plists, often with a .mobileconfig extension."},
{id:"j100-14",exam:100,topic:"Config Profiles",q:"Can configuration profiles enforce passcode requirements on mobile devices?",options:["Yes","No, only policies can","No, only Extension Attributes can","Only on supervised Macs"],note:"Passcode payloads are a standard configuration profile setting."},
{id:"j100-15",exam:100,topic:"Policies",q:"What are Jamf Pro Policies primarily used for?",options:["Automating tasks like installing packages, running scripts, and enforcing settings on computers","Purchasing apps in volume","Defining Setup Assistant panes","Creating LDAP accounts"],note:"Policies run on triggers (login, check-in, enrollment, custom) or a schedule, scoped to computers."},
{id:"j100-16",exam:100,topic:"Policies",q:"Which two organizational objects can a policy be scoped to directly, besides groups and individual computers?",options:["Buildings and Departments","Time zones and locales","VPNs and Wi-Fi networks","App categories"],note:"Buildings and Departments model an org's physical/logical structure for fast scoping."},
{id:"j100-17",exam:100,topic:"Policies",q:"A policy can be scoped to which two types of groups?",options:["Smart Groups and Static Groups","Only Smart Groups","Only Static Groups","Dynamic Groups and Federated Groups"],note:"Both group types are valid scoping targets."},
{id:"j100-18",exam:100,topic:"Apps & VPP",q:"What lets an organization purchase and distribute App Store apps in volume to managed devices?",options:["Apps and Books content in Apple Business Manager / School Manager (formerly VPP)","The Mac App Store login only","TestFlight","Homebrew"],note:"Volume licensing lives in ABM/ASM and is assigned through Jamf Pro."},
{id:"j100-19",exam:100,topic:"Apps & VPP",q:"For Jamf Pro to remove or update an app remotely on a mobile device, the app must be...?",options:["Managed by Jamf Pro","Free of charge","Installed manually first","Published by Apple only"],note:"Only apps installed under MDM management can be remotely removed or force-updated."},
{id:"j100-20",exam:100,topic:"Self Service",q:"What is Jamf Pro's Self Service?",options:["An on-demand catalog where users install approved apps and run items without admin help","A backup tool for user data","A remote desktop viewer","A ticketing system"],note:"Self Service is the end-user-facing app portal, available on macOS and mobile."},
{id:"j100-21",exam:100,topic:"Self Service",q:"Can an app or policy be made optional and install-on-demand rather than force-pushed?",options:["Yes, by scoping it as available in Self Service","No, all scoped items install automatically","Only for computers, never mobile devices","Only via Extension Attributes"],note:"Self Service availability makes install voluntary and user-initiated."},
{id:"j100-22",exam:100,topic:"Accounts & Privileges",q:"Which Jamf Pro privilege set grants read-only access to everything?",options:["Auditor","Administrator","Custom","Enrollment Only"],note:"Auditor accounts can view but not change anything."},
{id:"j100-23",exam:100,topic:"Accounts & Privileges",q:"Which privilege set gives complete, unrestricted access to all Jamf Pro settings and objects?",options:["Administrator (Full Access)","Auditor","Custom with zero boxes checked","Site Admin only"],note:"Full Access administrators bypass per-object privilege restrictions entirely."},
{id:"j100-24",exam:100,topic:"Accounts & Privileges",q:"What does a 'Custom' privilege set let an admin configure?",options:["A tailored mix of Create/Read/Update/Delete rights per object type","Only read access","Only the ability to enroll devices","Access to billing only"],note:"Custom lets you build least-privilege roles object-by-object."},
{id:"j100-25",exam:100,topic:"Org Structure",q:"Can management tasks like policies and profiles be scoped directly to Buildings and Departments?",options:["Yes","No, only to Smart Groups","No, only to individual devices","Only Departments, not Buildings"],note:"Buildings/Departments are first-class scoping targets, no group required."},
{id:"j100-26",exam:100,topic:"Org Structure",q:"What do Buildings and Departments represent in Jamf Pro?",options:["An org's physical/logical structure, usable for scoping and reporting","Software licensing tiers","VPN endpoints","Types of configuration profiles"],note:"They're metadata fields assigned to devices/users to mirror real-world organization."},
{id:"j100-27",exam:100,topic:"Fundamentals",q:"Which of these is a valid MDM remote command Jamf Pro can send to a mobile device?",options:["Lock Device","Turn Off Wi-Fi","Reboot into Recovery","Force Quit App"],note:"Standard mobile remote commands include Lock, Erase, Update Inventory, and Clear Passcode."},
{id:"j100-28",exam:100,topic:"Fundamentals",q:"Can Jamf Pro remotely erase all user content and settings from a supervised mobile device?",options:["Yes","No, only Apple Support can do that","Only on Macs, not mobile devices","Only during enrollment"],note:"The Erase Device MDM command performs a full wipe."},
{id:"j100-29",exam:100,topic:"Inventory & Groups",q:"What is an Extension Attribute used for?",options:["Collecting a custom piece of inventory data not natively gathered by Jamf Pro","Restricting an app from launching","Renaming a computer automatically","Encrypting a hard drive"],note:"EAs extend inventory with org-specific data points."},
{id:"j100-30",exam:100,topic:"Fundamentals",q:"An APNs certificate used by Jamf Pro is tied to what?",options:["An Apple ID","A Google Workspace account","A GitHub account","A Microsoft Entra ID tenant"],note:"The certificate is signed by Apple against an Apple ID and must be renewed annually."},
{id:"j100-31",exam:100,topic:"Org Structure",q:"What does 'Ownership' typically distinguish on a device inventory record?",options:["Institutional vs. Personal ownership","Wired vs. wireless network","macOS vs. iOS","Leased vs. purchased hardware"],note:"Ownership can affect which management capabilities and privacy protections apply."},
{id:"j100-32",exam:100,topic:"Policies",q:"What Jamf Pro feature can prevent a specific application from being opened on managed Macs?",options:["Restricted Software","Self Service categories","PreStage Enrollment","Smart Computer Group"],note:"Restricted Software blocks and optionally kills a named process fleet-wide."},

// ---------------- JAMF 200 ----------------
{id:"j200-1",exam:200,topic:"Architecture",q:"Which Java web application server hosts the Jamf Pro web app?",options:["Apache Tomcat","Nginx","IIS","Node.js"],note:"Tomcat serves the Jamf Pro web interface; Java must be kept current for it to run properly on-prem."},
{id:"j200-2",exam:200,topic:"Architecture",q:"Which database backs Jamf Pro's data storage?",options:["MySQL","PostgreSQL","MongoDB","SQLite"],note:"Settings and inventory data are committed to a MySQL database."},
{id:"j200-3",exam:200,topic:"Architecture",q:"On an on-premise Jamf Pro server, what must the admin keep updated for Tomcat to keep functioning correctly?",options:["Java","Python","Ruby","PHP"],note:"Tomcat is a Java application server, so its Java runtime needs ongoing patching."},
{id:"j200-4",exam:200,topic:"Architecture",q:"On Jamf Cloud versus on-prem, who maintains server software versions like Tomcat, Java, and MySQL?",options:["Jamf","The customer's IT team","Apple","A third-party MSP by default"],note:"Jamf Cloud shifts infrastructure maintenance to Jamf; on-prem puts it on the customer."},
{id:"j200-5",exam:200,topic:"Architecture",q:"What Apple resource provides warranty and purchase info about devices, generally tied to a reseller/GSX account?",options:["GSX (Global Service Exchange)","App Store Connect","Apple Business Essentials","Apple Configurator"],note:"GSX access typically requires an established volume of devices/reseller relationship."},
{id:"j200-6",exam:200,topic:"Architecture",q:"After changing a setting in Jamf Pro, what must happen for the change to persist?",options:["It must be saved / committed to the database","It applies instantly with no save step","It requires a full server restart","It syncs automatically every 24 hours only"],note:"Unsaved edits are lost if you navigate away before committing them."},
{id:"j200-7",exam:200,topic:"ADE & ABM/ASM",q:"What must be exchanged between Jamf Pro and Apple Business Manager / School Manager to enable Automated Device Enrollment?",options:["An MDM server token","A VPN certificate","An LDAP bind password","A Wi-Fi profile"],note:"The token links the ABM/ASM organization to a specific Jamf Pro MDM server."},
{id:"j200-8",exam:200,topic:"ADE & ABM/ASM",q:"Which Jamf Pro object controls Setup Assistant panes and initial settings for devices claimed via ADE?",options:["A PreStage Enrollment","A Smart Group","A Patch Policy","A Restricted Software record"],note:"PreStage settings apply the moment an ADE device is turned on."},
{id:"j200-9",exam:200,topic:"ADE & ABM/ASM",q:"How are App Store apps typically purchased and distributed at scale in an ABM/ASM-connected environment?",options:["Through Apps and Books (VPP) content, assigned device- or user-based","Individually with personal Apple IDs","Through TestFlight invites","Through Composer packages"],note:"Device-based assignment avoids needing an Apple ID on the device at all."},
{id:"j200-10",exam:200,topic:"Packages",q:"What tool is commonly used to build custom .pkg installers for macOS deployment?",options:["Composer","Xcode","Automator only","Terminal.app exclusively"],note:"Composer snapshots a system or folder to generate a distributable package."},
{id:"j200-11",exam:200,topic:"Packages",q:"Which three file types are common macOS software deployment packages?",options:[".pkg, .mpkg, and .dmg",".exe, .msi, and .zip",".app, .ipa, and .apk",".deb, .rpm, and .tar"],note:"These are the formats Jamf Pro can upload and deploy via policies."},
{id:"j200-12",exam:200,topic:"Packages",q:"Where must a package be uploaded before a policy can deploy it?",options:["A distribution point (e.g. Jamf's Cloud Distribution Point or an on-prem file share)","The user's home folder","An App Store Connect record","A GitHub repository"],note:"Distribution points are where clients actually download package content from."},
{id:"j200-13",exam:200,topic:"Scripting",q:"Which shell is the modern macOS default for scripting, replacing bash?",options:["zsh","tcsh","ksh","fish"],note:"Apple switched the default interactive/login shell to zsh starting with Catalina."},
{id:"j200-14",exam:200,topic:"Scripting",q:"In a Jamf Pro script, positional parameters 1–3 are reserved by the management framework for what?",options:["Mount point, computer name, and username","Script author, date, and version","The device serial number, MAC address, and IP","Policy ID, trigger, and category"],note:"Custom parameters therefore always start at $4."},
{id:"j200-15",exam:200,topic:"Scripting",q:"Custom values passed from a policy into a script use which parameter range?",options:["Parameters 4–11","Parameters 1–3","Parameters 12–20","There is no parameter passing in Jamf Pro"],note:"The script object labels 4–11 so policies can fill them with context-specific values."},
{id:"j200-16",exam:200,topic:"Profiles & Declarations",q:"What newer Apple management technology lets a device asynchronously fetch and apply status-based configuration, beyond traditional push profiles?",options:["Declarative Device Management (DDM)","Bonjour Sync","iCloud Profiles","Jamf Connect Sync"],note:"DDM shifts logic to the device, which reports status back rather than waiting on a push command."},
{id:"j200-17",exam:200,topic:"Profiles & Declarations",q:"What underlies most configuration profile payload settings?",options:["A property list (.plist)","A JSON schema exclusively","An unreadable binary blob","An XML schema unrelated to plist"],note:"Configuration profiles are structured, typically XML, plist files."},
{id:"j200-18",exam:200,topic:"Security & Permissions",q:"Alongside POSIX permissions, what macOS permission model uses Access Control Entries grouped into lists?",options:["ACL (Access Control List / ACE)","RBAC","SELinux contexts","Kerberos tickets"],note:"ACLs layer more granular entries on top of standard owner/group/other POSIX bits."},
{id:"j200-19",exam:200,topic:"Security & Permissions",q:"Why is a self-signed certificate risky for a Jamf Pro server's web interface?",options:["It isn't verified by a trusted CA, leaving trust decisions to the end user","It expires every 24 hours","It can't use HTTPS at all","It blocks all enrollment"],note:"Browsers/clients flag it as untrusted, training users to click through warnings — a bad habit to encourage."},
{id:"j200-20",exam:200,topic:"Security & Permissions",q:"Which macOS encryption feature does Jamf Pro commonly manage, including escrowing recovery keys?",options:["FileVault","BitLocker","LUKS","VeraCrypt"],note:"FileVault management and Institutional/Individual key escrow are core Jamf 200 topics."},
{id:"j200-21",exam:200,topic:"Smart Groups & EAs",q:"Can Smart Group criteria reference a custom Extension Attribute?",options:["Yes — any inventory field, including EAs, can be used as criteria","No, only native fields are allowed","Only for mobile devices","Only if the EA is a pop-up menu type"],note:"This is how admins build groups around org-specific data, like a patch tier or asset tag prefix."},
{id:"j200-22",exam:200,topic:"Smart Groups & EAs",q:"What are the three main input types for an Extension Attribute?",options:["Script, text field/pop-up menu, and LDAP mapping","CSV upload, API call, and QR code","Webhook, cron job, and plist","Manual entry, GPS location, and biometric"],note:"Script-based EAs are the most common for pulling dynamic values from the device."},
{id:"j200-23",exam:200,topic:"Patch & Caching",q:"What does Jamf Pro's Patch Management feature track for a defined software title?",options:["Available vs. installed versions across the fleet","CPU and RAM usage per app","App Store review scores","Licensing seat counts"],note:"Patch reports highlight how far behind the fleet is on a given title."},
{id:"j200-24",exam:200,topic:"Patch & Caching",q:"What built-in macOS service reduces bandwidth by locally caching software and App Store downloads for nearby Macs?",options:["Content Caching","Time Machine","iCloud Private Relay","Spotlight indexing"],note:"Content Caching serves downloads from a local Mac instead of re-fetching from Apple's CDN each time."},
{id:"j200-25",exam:200,topic:"Directory Integration",q:"Can Jamf Pro display the individual members of an LDAP/IdP group?",options:["No — membership must be looked up in the source directory itself","Yes, always","Only for Static Groups","Only if 2FA is disabled"],note:"Jamf Pro can use the group for scoping and authentication but doesn't mirror its member list."},
{id:"j200-26",exam:200,topic:"Directory Integration",q:"What's required for LDAP users to authenticate at enrollment or in Self Service?",options:["A configured LDAP/directory service (or cloud IdP) integration in Jamf Pro","A locally created Jamf Pro account for every user","A VPN connection","Nothing — it works by default"],note:"Directory bind settings must be configured under System Settings before this works."},
{id:"j200-27",exam:200,topic:"Architecture",q:"Where do you configure how often computers check in, and set startup / login / logout script triggers?",options:["Computer Management (Check-in) settings","Self Service settings","PreStage Enrollment","Smart Group criteria"],note:"Check-in frequency and framework triggers live under global Computer Management settings."},
{id:"j200-28",exam:200,topic:"Architecture",q:"Which macOS tool is most useful for diagnosing MDM enrollment or profile installation issues locally on a Mac?",options:["The unified log (Console.app / log show)","Activity Monitor only","Disk Utility","Migration Assistant"],note:"Combine the unified log with the device's management history in Jamf Pro for full context."},
{id:"j200-29",exam:200,topic:"Security & Permissions",q:"What's a common effect of 'Personal' vs. 'Institutional' ownership on a device record?",options:["It can affect which management capabilities and privacy protections apply","It changes the device's serial number","It disables Wi-Fi profiles","It forces re-enrollment weekly"],note:"Ownership context shapes what an org can enforce, especially in BYOD scenarios."},
{id:"j200-30",exam:200,topic:"ADE & ABM/ASM",q:"What has largely replaced traditional monolithic NetBoot/imaging workflows for modern Mac deployment?",options:["Automated Device Enrollment plus packages/scripts/profiles applied after Setup Assistant","Target Disk Mode cloning for every Mac","Manual USB installer creation for each machine","Time Machine restore from a golden image"],note:"Apple Silicon effectively ended NetBoot-style imaging in favor of this layered, zero-touch approach."},
{id:"j200-31",exam:200,topic:"Directory Integration",q:"What type of Jamf Pro account references a user/group defined in an external directory instead of a locally created one?",options:["An LDAP (directory-based) account","A Custom account","An API-only account","A Site account"],note:"These accounts inherit credentials from the connected directory rather than storing a local password."},
{id:"j200-32",exam:200,topic:"Architecture",q:"What can an 'Enrollment Only' privilege set do?",options:["Enroll devices only — no inventory or settings access","Everything an Administrator can do","Only view reports","Only manage Self Service content"],note:"It's a narrow, single-purpose role often handed to front-line deployment staff."},

// ---------------- PRO TIER (WWDC 2026 & Troubleshooting) ----------------
{id:"j999-1",exam:999,topic:"DDM 2026",q:"As of macOS 27, what technology is strictly required by Apple to manage and enforce software updates?",options:["Declarative Device Management (DDM)","Legacy MDM profiles","The softwareupdate binary in a policy","Content Caching via the Jamf binary"],note:"Apple entirely removed legacy MDM-based software update commands in the version 27 release. You must use DDM status reporting and enforcement."},
{id:"j999-2",exam:999,topic:"DDM 2026",q:"What happens natively in macOS 27 when a DDM configuration containing a software package is removed from a managed device?",options:["The OS automatically uninstalls the software package.","The app remains but its settings are wiped.","A removal script must be triggered manually via a policy.","The device requires a reboot to erase the app data."],note:"Package Uninstall finishes what the package declaration started. Deploy it declaratively, remove it declaratively — the OS removes the software when the config leaves."},
{id:"j999-3",exam:999,topic:"DDM 2026",q:"Under the 2026 DDM updates, how are network credentials (like passwords or certificates) handled compared to their configurations (like an Always-On VPN or DNS proxy)?",options:["Credentials are declared separately and referenced by the configurations that depend on them.","They are bundled together in a single payload.","Credentials must be manually typed by the user on first launch.","They are embedded in a custom script."],note:"By decoupling credentials from the configuration, updating a password no longer requires you to rebuild and re-push the entire VPN payload."},
{id:"j999-4",exam:999,topic:"Scripting",q:"You deploy a script containing `chmod 700 /Users/Shared/SupportLogs` via a Jamf Pro policy. Who is granted access to the folder?",options:["Only the owner (root), with read, write, and execute permissions.","Everyone on the system, with full access.","The local admin group only.","Only the currently logged-in standard user."],note:"Because the Jamf binary runs as root, root becomes the owner. The '700' designation explicitly locks out the Group (0) and Everyone (0)."},
{id:"j999-5",exam:999,topic:"Scripting",q:"A preflight script in your custom Composer `.pkg` exits with a code of `1`. What happens to the policy deploying this package?",options:["The installation immediately halts and the policy logs a Failure.","The package installs anyway, but logs a warning.","The Jamf binary attempts to run the postflight script instead.","The device reboots automatically to clear the error."],note:"Non-zero exit codes (like `exit 1`) in preinstall/preflight scripts tell the macOS installer engine that a fatal prerequisite failed, aborting the install immediately."},
{id:"j999-6",exam:999,topic:"DDM 2026",q:"With macOS 27, Declarative App Configuration expanded to include support for hardware-bound keys and what other major security attestation feature?",options:["Managed Device Attestation","FileVault Institutional Keys","Kernel Extension whitelisting","System Integrity Protection bypassing"],note:"Apps can now receive settings/credentials from the MDM that are cryptographically tied to the physical device hardware, significantly reducing the risk of credential theft."},
{id:"j999-7",exam:999,topic:"Troubleshooting",q:"You need to view the raw execution history of the Jamf management framework locally on a user's Mac to diagnose a silent failure. Which file do you check?",options:["/var/log/jamf.log","/Library/Logs/DiagnosticReports","/Users/Shared/jamf.txt","The macOS Unified Log only"],note:"While the Unified Log contains everything, `jamf.log` is specifically written by the Jamf binary and contains the exact transcript of policy executions and script outputs."},

/* ---- SUP-2026 · Apple Device Support (Apple Certified Support Professional) ---- */
{id:"sup-1",exam:300,topic:"Accounts & iCloud",q:"What does Find My rely on to help locate a lost personal device even when it has no Wi-Fi or cellular connection?",options:["A Bluetooth-based finding network contributed anonymously by nearby Apple devices","A GPS chip that broadcasts continuously to Apple's servers","The device's IMEI reported by the cell carrier","An always-on cellular ping from Apple"],note:"The offline finding network uses encrypted Bluetooth signals picked up by nearby Apple devices, not a persistent cellular or GPS broadcast."},
{id:"sup-2",exam:300,topic:"Accounts & iCloud",q:"What protection does turning on Find My automatically enable on a personal device?",options:["Activation Lock, tying the device to the owner's Apple Account so it can't be erased and reactivated by someone else","A firewall blocking all inbound connections","Automatic FileVault encryption","Content & Privacy Restrictions"],note:"Activation Lock is enabled the moment Find My is turned on, and requires the owner's Apple Account credentials to erase/reactivate the device."},
{id:"sup-3",exam:300,topic:"Accounts & iCloud",q:"A family wants to share purchased apps, an iCloud+ storage plan, and each other's locations across up to six Apple Accounts. What feature covers this?",options:["Family Sharing","iCloud Keychain","Managed Apple Accounts","Screen Time"],note:"Family Sharing links up to six Apple Accounts for shared purchases, storage, and optional location sharing."},
{id:"sup-4",exam:300,topic:"Accounts & iCloud",q:"Which iCloud feature securely stores and syncs a user's saved website passwords and Wi-Fi passwords across their signed-in devices?",options:["iCloud Keychain","iCloud Drive","Handoff","Universal Clipboard"],note:"iCloud Keychain end-to-end encrypts and syncs credentials between a user's own devices."},
{id:"sup-5",exam:300,topic:"Backup & Migration",q:"Which built-in macOS tool creates ongoing, versioned backups of a Mac to an external or network drive?",options:["Time Machine","Migration Assistant","Disk Utility","Archive Utility"],note:"Time Machine performs incremental, versioned backups so a user can restore individual files or the whole system from a point in time."},
{id:"sup-6",exam:300,topic:"Backup & Migration",q:"A customer just bought a new Mac and wants to bring over their accounts, files, and apps from a Time Machine backup during setup. What do they use?",options:["Migration Assistant","Time Machine restore only","System Information","Startup Security Utility"],note:"Migration Assistant runs during (or after) Setup Assistant and can pull data from a Time Machine backup, another Mac, or a Windows PC."},
{id:"sup-7",exam:300,topic:"Backup & Migration",q:"Where are an iPhone's local (non-iCloud), encrypted backups typically stored?",options:["On a computer, via the Finder's device pane (or iTunes on Windows)","On the SIM card","In Keychain Access only","On a paired Apple Watch"],note:"A local backup lives on the connected computer, and can optionally be encrypted with a password the user sets."},
{id:"sup-8",exam:300,topic:"Backup & Migration",q:"A customer's iPhone stops backing up to iCloud because it's out of storage. What's the most direct fix?",options:["Free up iCloud storage, or upgrade the iCloud+ plan","Reset All Settings","Erase All Content and Settings","Turn off Find My"],note:"An iCloud backup simply needs enough free space in the account's iCloud storage plan to complete."},
{id:"sup-9",exam:300,topic:"Security & Privacy",q:"Which macOS feature performs full-disk encryption to protect data at rest on the startup disk?",options:["FileVault","Gatekeeper","XProtect","System Integrity Protection (SIP)"],note:"FileVault encrypts the entire startup disk; without the account password or a recovery key, the data is unreadable."},
{id:"sup-10",exam:300,topic:"Security & Privacy",q:"What macOS technology scans for and quarantines apps matching known malware signatures?",options:["XProtect","FileVault","Gatekeeper","Time Machine"],note:"XProtect is Apple's built-in signature-based malware check, updated independently of full OS updates."},
{id:"sup-11",exam:300,topic:"Security & Privacy",q:"What macOS feature checks that a downloaded app is properly signed and notarized before allowing it to open for the first time?",options:["Gatekeeper","FileVault","XProtect","SIP"],note:"Gatekeeper performs the first-launch trust check; XProtect separately watches for known malware signatures."},
{id:"sup-12",exam:300,topic:"Security & Privacy",q:"What optional protection dramatically restricts message attachments, link previews, and other complex features, aimed at users facing highly targeted cyberattacks?",options:["Lockdown Mode","Stolen Device Protection","Screen Time","Content & Privacy Restrictions"],note:"Lockdown Mode trades convenience for a sharply reduced attack surface, intended for a small number of at-risk users."},
{id:"sup-13",exam:300,topic:"Networking",q:"A Mac can see nearby Wi-Fi networks but won't join the customer's home network specifically. What's a reasonable first troubleshooting step?",options:["Forget the network in Wi-Fi settings and rejoin, re-entering the password","Reinstall macOS","Reset the SMC first","Replace the Wi-Fi card"],note:"A stale/incorrect saved network profile is a common, low-risk first cause to rule out before anything more invasive."},
{id:"sup-14",exam:300,topic:"Networking",q:"Which built-in tool helps diagnose Wi-Fi problems and reports on nearby networks and signal quality?",options:["Wireless Diagnostics (Option-click the Wi-Fi menu bar icon)","Console.app alone","Network Utility's Traceroute tab alone","Activity Monitor"],note:"Wireless Diagnostics walks through a guided assistant and can generate a detailed report for escalation."},
{id:"sup-15",exam:300,topic:"Networking",q:"Which feature lets a nearby iPhone share its cellular data connection with a Mac over Wi-Fi, Bluetooth, or USB?",options:["Personal Hotspot","AirDrop","Continuity Camera","Universal Control"],note:"Personal Hotspot turns the iPhone's cellular connection into a shareable network for other trusted devices."},
{id:"sup-16",exam:300,topic:"Networking",q:"A user reports slow file transfers on the office network. Which built-in tool shows real-time network bandwidth per app or process?",options:["Activity Monitor's Network tab","Console.app","Disk Utility","System Information"],note:"Activity Monitor's Network tab breaks down sent/received data by process, useful for spotting a bandwidth hog."},
{id:"sup-17",exam:300,topic:"Troubleshooting & Recovery",q:"How does a technician boot an Apple Silicon Mac into macOS Recovery?",options:["Press and hold the power button until 'Loading startup options' appears","Hold Command-R at startup","Hold Option at startup only","There is no built-in Recovery; a USB installer is required"],note:"Apple Silicon Macs use the power button to reach startup options, including Recovery; Command-R is the Intel-era shortcut."},
{id:"sup-18",exam:300,topic:"Troubleshooting & Recovery",q:"A Mac's storage is reporting file system errors. Which built-in tool checks and repairs disk-level issues?",options:["Disk Utility → First Aid","Migration Assistant","Time Machine","Activity Monitor"],note:"First Aid verifies and repairs the file system structure of a selected volume or disk."},
{id:"sup-19",exam:300,topic:"Troubleshooting & Recovery",q:"An iPhone with Face ID is completely unresponsive. What's the standard forced-restart sequence?",options:["Quickly press and release Volume Up, then Volume Down, then press and hold the Side button","Hold Home and the Side button together","Hold Volume Down and the Side button only","Double-press the Side button"],note:"This three-step sequence is the current forced-restart method on Face ID iPhone models."},
{id:"sup-20",exam:300,topic:"Troubleshooting & Recovery",q:"Which tool, run at startup, checks a Mac's own hardware (logic board, memory, and more) for faults?",options:["Apple Diagnostics","Console.app","Disk Utility","Activity Monitor"],note:"Apple Diagnostics runs outside the installed OS and reports reference codes tied to specific hardware issues."},
{id:"sup-21",exam:300,topic:"Accessibility & Peripherals",q:"Which macOS feature lets a user control multiple nearby Macs (or a Mac and an iPad) with one keyboard and mouse?",options:["Universal Control","AirDrop","Sidecar","Handoff"],note:"Universal Control extends a single pointer and keyboard seamlessly across nearby signed-in devices."},
{id:"sup-22",exam:300,topic:"Accessibility & Peripherals",q:"A user wants their iPad to work as a wireless second display for their Mac, with Apple Pencil support. What feature enables this?",options:["Sidecar","Universal Control","AirPlay Mirroring alone","Continuity Camera"],note:"Sidecar turns a nearby iPad into an extended or mirrored Mac display, with Apple Pencil input."},
{id:"sup-23",exam:300,topic:"Accessibility & Peripherals",q:"Which macOS accessibility feature reads screen content aloud and enables full navigation without needing to see the display?",options:["VoiceOver","Zoom","Switch Control","Live Speech"],note:"VoiceOver is Apple's built-in screen reader, supporting gesture and keyboard navigation."},
{id:"sup-24",exam:300,topic:"Accessibility & Peripherals",q:"A customer wants their iPhone's camera to act as a high-quality webcam for video calls on their Mac. What feature provides this?",options:["Continuity Camera","AirPlay","Sidecar","Handoff"],note:"Continuity Camera lets a nearby iPhone serve as a wireless or wired webcam, including features like Desk View and Center Stage."},

/* ---- DEP-2026 · Apple Deployment and Management (Apple Certified IT Professional) ---- */
{id:"dep-1",exam:400,topic:"ABM/ASM & MDM",q:"What must an organization set up before it can use zero-touch enrollment or volume app purchasing at all?",options:["An Apple Business Manager or Apple School Manager account","A Jamf Pro server specifically","A Managed Apple Account for every employee","A Content Caching server"],note:"ABM/ASM is the organizational hub that every other deployment capability — ADE, Apps and Books, federated accounts — connects through."},
{id:"dep-2",exam:400,topic:"ABM/ASM & MDM",q:"What links a third-party MDM solution to an organization's Apple Business Manager instance?",options:["An MDM server token exchanged between ABM/ASM and the MDM","A shared administrator password","A site-to-site VPN tunnel","A DNS TXT record"],note:"The server token authorizes that specific MDM server to manage devices and content assigned to it in ABM/ASM."},
{id:"dep-3",exam:400,topic:"ABM/ASM & MDM",q:"How does a device typically become associated with an organization's Apple Business Manager for zero-touch deployment?",options:["Purchased through a participating reseller/carrier, or added manually via Apple Configurator","Only by visiting an Apple Store in person","Automatically the first time it joins any Wi-Fi network","By restoring from any iCloud backup"],note:"Participating resellers report the purchase to ABM/ASM automatically; Apple Configurator covers devices bought outside that channel."},
{id:"dep-4",exam:400,topic:"ABM/ASM & MDM",q:"What is the core job of an MDM server in an Apple deployment?",options:["Sending management commands and configurations to enrolled devices over Apple's push and declarative channels","Hosting the App Store catalog itself","Issuing Apple Accounts to new employees","Replacing the need for Wi-Fi infrastructure"],note:"The MDM is the control plane; it never replaces Apple's own services, it configures and monitors devices that use them."},
{id:"dep-5",exam:400,topic:"Enrollment",q:"Which enrollment method is meant for organization-owned devices, applies supervision automatically, and can lock the MDM profile so a user can't remove it?",options:["Automated Device Enrollment (ADE)","User Enrollment","Manual profile installation","Ad-hoc Apple Configurator enrollment"],note:"ADE is Apple's zero-touch path, tied to ABM/ASM and designed for company- or school-owned hardware."},
{id:"dep-6",exam:400,topic:"Enrollment",q:"Which enrollment method targets personally-owned (BYOD) devices and keeps managed data cryptographically separate from personal data?",options:["User Enrollment","Automated Device Enrollment","Shared iPad enrollment","Recovery Mode enrollment"],note:"User Enrollment creates a separate managed APFS volume/data silo instead of supervising the whole device."},
{id:"dep-7",exam:400,topic:"Enrollment",q:"What Apple Account type is created for User Enrollment, keeping work access separate from a person's personal Apple Account?",options:["A Managed Apple Account","A Family Sharing account","A Content Caching account","A Guest account"],note:"The Managed Apple Account exists alongside — but never merges with — the user's personal Apple Account."},
{id:"dep-8",exam:400,topic:"Enrollment",q:"Which tool manually supervises or configures a device connected directly via USB, useful for testing outside of ADE?",options:["Apple Configurator","Migration Assistant","Disk Utility","Boot Camp Assistant"],note:"Apple Configurator can prepare, supervise, and add devices to Apple Business Manager without a purchase-based ADE link."},
{id:"dep-9",exam:400,topic:"Profiles & DDM",q:"What replaced purely push-based profile delivery, letting a device asynchronously check status and report compliance back to the MDM?",options:["Declarative Device Management (DDM)","Automated Device Enrollment","Content Caching","Bonjour discovery"],note:"DDM moves logic onto the device itself, which evaluates declarations locally and reports status changes."},
{id:"dep-10",exam:400,topic:"Profiles & DDM",q:"Under DDM, what are the core building blocks used to describe a desired device state and report back on it?",options:["Declarations, Status items, and Management (Activation)","Profiles, Policies, and Packages","Tokens, Certificates, and Payloads","Groups, Scopes, and Triggers"],note:"Declarations describe the desired configuration; Status items report device state; Activations tie declarations to conditions."},
{id:"dep-11",exam:400,topic:"Profiles & DDM",q:"A configuration profile is created in an MDM but never assigned to any device or group. What happens?",options:["It isn't deployed anywhere until it's scoped","It deploys to every enrolled device by default","It deploys automatically to supervised devices only","It's queued and applied at the next OS update"],note:"Scope is what actually targets a profile at devices or users — creating it alone does nothing."},
{id:"dep-12",exam:400,topic:"Profiles & DDM",q:"What underlying structured format do most configuration profile payloads use?",options:["A property list (.plist)","An unstructured binary blob","YAML","A compiled executable"],note:"Configuration profiles are structured, typically XML, property list files, often with a .mobileconfig extension."},
{id:"dep-13",exam:400,topic:"App & Content Distribution",q:"What replaced the older Volume Purchase Program (VPP) for buying and assigning apps and books in bulk?",options:["Apps and Books in Apple Business Manager / Apple School Manager","The regular consumer App Store","TestFlight","Apple Configurator licensing"],note:"Apps and Books is the current name for managed, bulk content purchasing and assignment inside ABM/ASM."},
{id:"dep-14",exam:400,topic:"App & Content Distribution",q:"Which app assignment method avoids needing any Apple Account signed in on a shared or kiosk-style device?",options:["Device-based assignment","User-based assignment only","Personal Apple ID purchase","Family Sharing purchase"],note:"Device-based assignment ties the license to the device record itself, not to a signed-in account."},
{id:"dep-15",exam:400,topic:"App & Content Distribution",q:"What's required before an organization can revoke a volume-purchased app license from one device and reassign it to another?",options:["The app must have been assigned through managed/volume distribution in the first place","The device must be jailbroken","The app must be free","The device must be offline"],note:"Only apps distributed through managed licensing can be centrally reclaimed and reassigned."},
{id:"dep-16",exam:400,topic:"App & Content Distribution",q:"Shared iPad lets multiple students sign in on one device with their own account. What does ABM/ASM provision to make this work at scale?",options:["A Managed Apple Account for each student or user","A single shared Apple Account for the whole class","Local-only accounts with no cloud sync","Guest Mode exclusively"],note:"Each student's Managed Apple Account keeps their own documents, settings, and app data separate on shared hardware."},
{id:"dep-17",exam:400,topic:"Identity & SSO",q:"What lets a Managed Apple Account authenticate using an organization's existing identity provider (like Okta or Microsoft Entra ID) instead of a separate Apple-only password?",options:["Federated authentication / SSO integration with the IdP","iCloud Keychain sync","Family Sharing","Content Caching"],note:"Federation ties Managed Apple Account sign-in to the org's own directory, including its MFA and password policies."},
{id:"dep-18",exam:400,topic:"Identity & SSO",q:"Why would an IT admin federate Managed Apple Accounts with their identity provider?",options:["To centralize credential management, MFA, and offboarding through the org's existing directory","To bypass the need for an MDM entirely","To let personal iCloud data sync onto work devices","To disable Activation Lock fleet-wide"],note:"Federation keeps identity lifecycle (creation, MFA, deactivation) in one authoritative system instead of two."},
{id:"dep-19",exam:400,topic:"Identity & SSO",q:"What extension type lets an MDM-managed app obtain sign-in tokens using the device's platform SSO, instead of repeated password prompts?",options:["An SSO app extension (Platform SSO)","A VPN payload","A web content filter payload","A Content Caching agent"],note:"Platform SSO extensions let compatible apps silently reuse an already-established, trusted sign-in session."},
{id:"dep-20",exam:400,topic:"Identity & SSO",q:"When an employee leaves the organization, what's the recommended way to fully revoke their Managed Apple Account access?",options:["Deprovision/deactivate the account in the identity provider and Apple Business Manager","Just erase their device locally","Change the office Wi-Fi password","Nothing — it expires automatically after 30 days"],note:"Federated accounts should be deprovisioned at the source of truth (the IdP/ABM), not just removed from one device."},
{id:"dep-21",exam:400,topic:"Security & Compliance",q:"What MDM-driven feature cryptographically ties credentials or configurations to the specific physical hardware they were issued to, reducing credential-theft risk?",options:["Managed Device Attestation","FileVault","Content Caching","Bonjour Sync"],note:"Managed Device Attestation lets a service verify a request truly came from a specific, hardware-bound, managed device."},
{id:"dep-22",exam:400,topic:"Security & Compliance",q:"For an org-owned, supervised Mac, which FileVault key escrow option lets IT recover encrypted data without depending on one individual's personal key?",options:["Institutional recovery key escrow to the MDM","Personal recovery key texted to the user","No escrow — FileVault can't be centrally managed","iCloud Keychain sync of the FileVault key"],note:"Institutional recovery keys are generated and escrowed centrally, independent of any one user's personal key."},
{id:"dep-23",exam:400,topic:"Security & Compliance",q:"What must be true for a passcode/password policy pushed via MDM to actually be enforceable on a device?",options:["The device must be supervised (or at least have the profile properly scoped and installed) with the payload correctly configured","The device must be jailbroken first","The user must approve every enforcement individually","Passcodes can never be enforced remotely"],note:"Enforcement depends on supervision level and correct profile scope/configuration — not on user opt-in."},
{id:"dep-24",exam:400,topic:"Security & Compliance",q:"Which network configuration routes and can inspect all of a supervised device's traffic through a single MDM-managed VPN connection at all times?",options:["Always-On VPN","Personal Hotspot","Content Caching","AirDrop"],note:"Always-On VPN keeps a supervised device's traffic tunneled continuously, not just per-app or on-demand."},

/* ---- SVC-16A / SVC-19A · Apple Service Fundamentals (prereq for ACiT / ACMT) ---- */
{id:"svc-1",exam:500,topic:"Customer Experience",q:"A customer arrives agitated because their repair is taking longer than expected. What's the best first response?",options:["Acknowledge their frustration, then clearly explain the status and next steps","Immediately offer a refund to end the conversation","Point out that their device model is old and outdated","Direct them to file a written complaint before discussing anything"],note:"Acknowledging the emotion first, then giving concrete information, de-escalates far more reliably than jumping straight to a fix or a policy."},
{id:"svc-2",exam:500,topic:"Customer Experience",q:"Before starting any repair, what should a technician always do regarding a customer's device data?",options:["Explain the data-loss risk of that specific repair and confirm the customer has a backup","Assume the customer already backed up and skip the conversation","Automatically create a backup without asking","Tell the customer data loss never happens with Apple repairs"],note:"Setting accurate data-loss expectations up front protects both the customer and the shop from a painful surprise later."},
{id:"svc-3",exam:500,topic:"Customer Experience",q:"A customer's device is out of warranty and the repair estimate is high. What best reflects good customer communication?",options:["Clearly explain the coverage status, the cost, and the available options before proceeding","Proceed with the repair silently and bill them afterward","Tell them nothing can be done and turn them away","Only mention the cost if they happen to ask"],note:"Transparency about coverage and cost, before work begins, is central to how this exam frames good service."},
{id:"svc-4",exam:500,topic:"Customer Experience",q:"Why does accurate repair documentation matter for the customer experience, not just internal tracking?",options:["It gives the customer (and any technician) an accurate history of what was done to their device","It's only used for internal sales metrics","It has no effect on the customer, only on inventory","It's optional unless the customer specifically asks for it"],note:"Good documentation protects the customer's warranty history and helps any future technician pick up context quickly."},
{id:"svc-5",exam:500,topic:"Customer Experience",q:"A customer wants a status update on their in-progress repair. What's the appropriate resource for a technician to check?",options:["The repair's record in the service management/tracking system (e.g. GSX-based tools)","The technician's personal notes only","There is no way to track repair status","The customer must contact Apple directly, not the service provider"],note:"Repair status should live in the shared tracking system, not in one technician's head or notebook."},
{id:"svc-6",exam:500,topic:"ESD Precautions",q:"What is ESD, and why does it matter when servicing Apple devices?",options:["Electrostatic Discharge — an unseen static charge that can silently damage sensitive internal components","Extended Service Duration — a warranty term","External Storage Device — a type of accessory","Emergency Shutdown Directive — a safety procedure"],note:"ESD damage is often invisible at the time it happens, which is exactly why consistent precautions matter every time."},
{id:"svc-7",exam:500,topic:"ESD Precautions",q:"Which of these is a standard ESD precaution before opening a device for repair?",options:["Wear a properly grounded anti-static wrist strap and work on an ESD mat","Wear rubber gloves with no grounding","Work on a carpeted surface for cushioning","Keep the device plugged into wall power while grounding yourself"],note:"Grounding yourself (and the work surface) to a common point is what actually bleeds off static charge safely."},
{id:"svc-8",exam:500,topic:"ESD Precautions",q:"Why should synthetic clothing materials be avoided or covered in an ESD-sensitive work area?",options:["They generate and hold static charge more readily than natural fibers","They're flammable near tools","They interfere with Wi-Fi signals","They scratch device surfaces"],note:"Synthetics like polyester and fleece build up static far more easily than cotton, increasing ESD risk near open hardware."},
{id:"svc-9",exam:500,topic:"Safety",q:"A technician notices a lithium-ion battery is visibly swollen during a repair. What's the correct response?",options:["Handle it with caution per battery-safety procedure and isolate/dispose of it properly — never puncture or bend it","Puncture it to release pressure safely","Continue the repair normally; swelling is only cosmetic","Charge it fully first to confirm it still works"],note:"A swollen battery is a genuine safety hazard; puncturing or bending it can cause fire or chemical burns."},
{id:"svc-10",exam:500,topic:"Safety",q:"What's a key safety reason for disconnecting a device's battery (when possible) before working near the display or logic board?",options:["To reduce the risk of electric shock or accidental short-circuits during the repair","It's required only for cosmetic repairs","It speeds up the repair, with no real safety benefit","It's needed only on devices still under warranty"],note:"An energized board raises the risk of shorts and shock while probing or disconnecting components."},
{id:"svc-11",exam:500,topic:"Safety",q:"Which of these is a general workspace safety practice recommended during repairs?",options:["Keep tools organized and the workspace free of clutter and liquids","Eat and drink at the repair bench to save time","Stack multiple open devices on top of each other","Work with tools ungrounded to move faster"],note:"A clean, organized, liquid-free bench reduces both ESD risk and the chance of physical damage or accidents."},
{id:"svc-12",exam:500,topic:"Troubleshooting",q:"What should generally happen before a technician assumes a hardware fault and begins disassembly?",options:["Rule out software-level causes first (updates, resets, diagnostics) where the symptom allows","Skip straight to replacing the most expensive component","Always reinstall the OS regardless of the symptom","Immediately escalate to a full device replacement"],note:"Software-level checks are faster, cheaper, and non-destructive — they belong earlier in the troubleshooting flow."},
{id:"svc-13",exam:500,topic:"Troubleshooting",q:"Which official tool helps a technician run a built-in hardware check to isolate a suspected component failure?",options:["Apple Diagnostics","Time Machine","Migration Assistant","Screen Time"],note:"Apple Diagnostics reports reference codes that point toward specific hardware subsystems."},
{id:"svc-14",exam:500,topic:"Troubleshooting",q:"A customer describes an intermittent issue that isn't currently reproducible on the bench. What's a good next step?",options:["Ask clarifying questions about when/how it happens and check diagnostic or crash logs for patterns","Tell the customer it isn't a real issue","Replace the most commonly-failing part without further diagnosis","Close the case immediately since it can't be seen live"],note:"Intermittent issues need more information gathering, not guesswork parts-swapping, before a repair decision is made."},
{id:"svc-15",exam:500,topic:"Product Knowledge",q:"What system lets a technician verify a device's warranty status, purchase date, and eligible service options by serial number?",options:["GSX (Global Service Exchange)","App Store Connect","iCloud.com","Apple Configurator"],note:"GSX is the authorized-service system for warranty checks, parts ordering, and repair case management."},
{id:"svc-16",exam:500,topic:"Product Knowledge",q:"Why does Apple use part serialization/pairing on certain genuine replacement components?",options:["To verify authentic parts and preserve full feature functionality and security after a repair","To prevent any repairs from ever being performed","To track a customer's location","To increase the retail price only"],note:"Serialization confirms a genuine part and helps features tied to that component (like True Tone or battery health reporting) keep working correctly."},
{id:"svc-17",exam:500,topic:"Product Knowledge",q:"What resource should a technician consult for the correct, current repair procedure and specifications for a specific device model?",options:["Apple's official service/repair documentation for that product","General internet forums exclusively","Guesswork based on a similar-looking older model","The customer's own instructions"],note:"Official service documentation is updated per model/revision and is the authoritative source, not forum posts or assumptions."},
{id:"svc-18",exam:500,topic:"Product Knowledge",q:"How should AppleCare coverage status factor into a service technician's intake process?",options:["It determines what's covered at no or reduced cost, so it should be checked before quoting a customer","It has no effect on repair cost or process","It only covers accessories, never the device itself","It's automatically applied with no need to check status"],note:"Checking coverage before quoting avoids surprising the customer with an inaccurate estimate."}
];
